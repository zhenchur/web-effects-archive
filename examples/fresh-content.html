<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fresh Content — standalone demo</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    #scroll-track { height: 600svh; }
    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      height: 100dvh;
      padding-inline: clamp(16px, 2vw, 40px);
    }
    #scene { width: 100%; height: 100%; max-width: 1920px; margin: auto; }
    body[data-reduced-motion="true"] #scroll-track { height: auto; }
    body[data-reduced-motion="true"] .stage { position: relative; height: auto; }
    body[data-reduced-motion="true"] #scene { height: auto; }
  </style>
</head>
<body>
  <main id="scroll-track">
    <div class="stage"><div id="scene"></div></div>
  </main>
  <script type="module">
    import { createFreshContent } from './fresh-content.js';

    const track = document.querySelector('#scroll-track');
    const stage = document.querySelector('.stage');
    const scene = document.querySelector('#scene');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    let effect;
    let frame = 0;
    let needsRefresh = false;
    let disposed = false;
    let scrollStart = 0;
    let travel = 0;

    function render() {
      frame = 0;
      if (disposed) return;
      if (needsRefresh) {
        effect.refresh();
        scrollStart = window.scrollY + track.getBoundingClientRect().top;
        travel = Math.max(0, track.offsetHeight - stage.offsetHeight);
        needsRefresh = false;
      }
      const progress = travel > 0 ? (window.scrollY - scrollStart) / travel : 0;
      effect.setProgress(Math.max(0, Math.min(1, progress)));
    }

    function scheduleRender() {
      if (!disposed && !frame) frame = requestAnimationFrame(render);
    }

    function refresh() {
      needsRefresh = true;
      scheduleRender();
    }

    function mount() {
      effect?.destroy();
      document.body.dataset.reducedMotion = String(motionPreference.matches);
      effect = createFreshContent(scene, {
        repetitions: 3,
        reducedMotion: motionPreference.matches,
      });
      refresh();
    }

    function dispose(event) {
      if (event.persisted) return;
      disposed = true;
      cancelAnimationFrame(frame);
      window.removeEventListener('scroll', scheduleRender);
      window.removeEventListener('resize', refresh);
      window.removeEventListener('pagehide', dispose);
      motionPreference.removeEventListener('change', mount);
      effect.destroy();
    }

    mount();
    window.addEventListener('scroll', scheduleRender, { passive: true });
    window.addEventListener('resize', refresh);
    window.addEventListener('pagehide', dispose);
    motionPreference.addEventListener('change', mount);
    document.fonts.ready.then(refresh);
  </script>
</body>
</html>
